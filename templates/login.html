<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dashboard Data Pasar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .login-icon {
            font-size: 3.5rem;
            color: #60a5fa;
            text-align: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .form-label {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .pin-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            letter-spacing: 4px;
            text-align: center;
            transition: all 0.2s;
        }
        .pin-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .pin-input::placeholder {
            color: #64748b;
            letter-spacing: 2px;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .footer-text {
            text-align: center;
            margin-top: 32px;
            color: #64748b;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Dashboard Data Pasar</h1>
        <p class="subtitle">Masukkan PIN untuk melanjutkan</p>
        
        {% if error %}
            <div class="alert-error">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                {{ error }}
            </div>
        {% endif %}
        
        <form method="post" action="{% url 'dashboard:login' %}">
            {% csrf_token %}
            <label class="form-label" for="pin">
                <i class="bi bi-key-fill me-1"></i>PIN Akses
            </label>
            <input 
                type="password" 
                id="pin" 
                name="pin" 
                class="pin-input" 
                placeholder="••••••••" 
                autocomplete="off"
                autofocus
                required
            >
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
            </button>
        </form>
        
        <p class="footer-text">
            &copy; 2026 Dashboard Data Pasar
        </p>
    </div>
</body>
</html>
